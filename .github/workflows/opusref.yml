name: Libopus Interoperability (opusref)

on:
  push:
    branches:
      - main
      - "dev/**"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: opusref-${{ github.ref }}
  cancel-in-progress: true

jobs:
  opusref:
    name: reference tests vs libopus
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Install and configure libopus
        run: |
          sudo apt-get install -y libopus-dev
          echo "CGO_CFLAGS=$(pkg-config --cflags opus)" >> "$GITHUB_ENV"

      - name: SILK encoder quality (AB vs libopus)
        run: go test -tags opusref -count=1 -v -run TestOpusSILKABAgainstLibopusEncoder .

      - name: SILK encoder conformance (SILKOnly)
        run: go test -tags opusref -count=1 -run TestCGOEncodeRefSILKOnly .

      - name: Short-frame interoperability
        run: go test -tags opusref -count=1 -run '^TestCGOEncodeRefShortFrames$' .

      - name: SILK and hybrid FEC/PLC interoperability
        run: go test -tags opusref -count=1 -run '^TestCGOEncodeRefSILKFEC$|^TestCGOEncodeRefSILKFECMultiFrame$|^TestCGODecodeFECMatchesLibopus$|^TestCGODecodeFECStereoAndHybrid$|^TestCGORefSILKAndHybridPLC$' .

      - name: Multistream interoperability
        run: go test -tags opusref -count=1 -run '^TestCGOMultistreamInteroperability$' .

      - name: Projection interoperability
        run: go test -tags opusref -count=1 -run '^TestCGOProjectionMatricesMatchLibopus$|^TestCGOProjectionFamily[23]Interoperability$' .

      - name: Vendor libopus source (packet-extension oracle)
        run: |
          curl -sL -o opus-src.tar.gz https://downloads.xiph.org/releases/opus/opus-1.6.1.tar.gz
          tar -xzf opus-src.tar.gz
          mv opus-1.6.1 libopus

      - name: Packet extensions libopus oracle
        # Override the distro CGO_CFLAGS (-I/usr/include/opus, libopus 1.4 without
        # OpusDRED) so the vendored 1.6.1 headers resolve consistently with the
        # bundled src/extensions.c. The oracle only uses the self-contained
        # extensions.c, so linking the 1.4 shared lib stays ABI-safe.
        env:
          CGO_CFLAGS: -I${{ github.workspace }}/libopus/include -I${{ github.workspace }}/libopus/celt -I${{ github.workspace }}/libopus/src
        run: go test -tags "opusref opusextsrc" -count=1 -run '^TestPacketExtensionsLibopusOracle$' .

      - name: Build libopus 1.6.1 (static)
        # The distro libopus (1.4) lacks the 1.6 APIs the opus16-tagged tests
        # call (opus_packet_has_lbrr, opus_decode24 and their multistream and
        # projection variants), so build the vendored tree for them.
        run: |
          cmake -S libopus -B opus-build -DCMAKE_BUILD_TYPE=Release -DOPUS_BUILD_SHARED_LIBRARY=OFF -DOPUS_BUILD_TESTING=OFF -DOPUS_BUILD_PROGRAMS=OFF -DCMAKE_POSITION_INDEPENDENT_CODE=ON
          cmake --build opus-build -j"$(nproc)"

      - name: libopus 1.6 output APIs (opus16)
        env:
          CGO_CFLAGS: -I${{ github.workspace }}/libopus/include
          CGO_LDFLAGS: -L${{ github.workspace }}/opus-build
        run: go test -tags "opusref opus16" -count=1 -run '^(TestCGODecoderOutputConversionMatchesLibopus|TestCGOMultistreamProjectionOutputMatchesLibopus)$' .

      - name: Build the libopus encoder oracle
        # A plain scalar C build (no SIMD, no FMA) of the vendored 1.6.1 tree
        # with the trace instrumentation the encoder oracle tests parse.
        shell: pwsh
        run: ./scripts/oracle/build_encoder.ps1

      - name: Encoder bit-exactness vs the libopus oracle
        # CELT-only, hybrid, SILK, automatic mode, mode transitions, FEC and
        # DTX packets must stay byte-identical to libopus 1.6.1.
        # The decoder's PLC and official-vector PCM must stay sample-exact.
        run: go test -tags opusref -count=1 -timeout 60m -run '^(TestCELTEncoderOracle|TestHybridEncoderOracle|TestSILKEncoder(InputPipeline|Stereo)Oracle.*|TestAutoModeOracle|TestAutoModeOracleSweep|TestAutoModeTransitionOracle|TestDTXOracle|TestMultistreamEncoderOracle|TestDecoderPLCOracle|TestDecoderVectorOracle|TestDecoderShortFrameOracle|TestHybridFECBustOracle)$' .

      - name: Decoder reference (12/12 vectors)
        run: go test -tags opusref -count=1 -run TestCGORef .

  plainc-oracle:
    # The packet- and sample-exact comparison against a plain scalar C build
    # of libopus 1.6.1 on both architectures, so the arm64 NEON kernels are
    # checked against libopus directly and not only against the pure Go
    # references.
    name: plain-C libopus oracle (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
          cache: true

      - name: Report toolchain
        run: |
          go version
          go env GOARCH

      - name: Install libopus and PowerShell
        run: |
          sudo apt-get update -q
          sudo apt-get install -y libopus-dev cmake
          echo "CGO_CFLAGS=$(pkg-config --cflags opus)" >> "$GITHUB_ENV"
          if ! command -v pwsh >/dev/null; then
            sudo snap install powershell --classic
          fi

      - name: Vendor libopus 1.6.1 source
        run: |
          curl -sL -o opus-src.tar.gz https://downloads.xiph.org/releases/opus/opus-1.6.1.tar.gz
          tar -xzf opus-src.tar.gz
          mv opus-1.6.1 libopus

      - name: Build the plain-C oracles
        # Scalar builds (gcc -O1 -ffp-contract=off, no SIMD, no FMA).
        shell: pwsh
        run: |
          ./scripts/oracle/build.ps1
          ./scripts/oracle/build_encoder.ps1
          ./scripts/oracle/build_encoder_audit.ps1
          ./scripts/oracle/decoder_audit/build.ps1

      - name: Encoder and decoder oracles
        run: go test -tags opusref -count=1 -timeout 60m -run '^(TestCELTEncoderOracle|TestHybridEncoderOracle|TestSILKEncoder(InputPipeline|Stereo)Oracle.*|TestAutoModeOracle|TestAutoModeOracleSweep|TestAutoModeTransitionOracle|TestDTXOracle|TestMultistreamEncoderOracle|TestDecoderPLCOracle|TestDecoderVectorOracle|TestDecoderShortFrameOracle|TestHybridFECBustOracle)$' .

      - name: libopus audit, parity hunt and chaos CTL cells
        # NaN input cells are skipped: they differ from libopus on main as
        # well and are tracked separately.
        env:
          OPUS_LIBOPUS_AUDIT: "1"
        run: |
          go test -tags opusref -count=1 -timeout 60m \
            -run '^(TestAudit|TestHunt|TestChaosEncoderCTLOracle)' \
            -skip 'TestAuditEdgeInputs/nan/' .
          go test -tags opusref -count=1 -timeout 30m ./internal/audit/decoder/
